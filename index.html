<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>たのしい！さんすうかるた</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
    <!-- Tone.js for Web Audio Synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #f0fdf4;
        }

        .font-kiwi {
            font-family: 'Kiwi Maru', serif;
        }

        /* かるた札風スタイル */
        .karuta-card {
            background: linear-gradient(135deg, #ffffff 0%, #fffbf0 100%);
            box-shadow: 0 6px 0 #d97706, 0 10px 15px rgba(0,0,0,0.1);
            transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
            border: 4px solid #f59e0b;
        }

        .karuta-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #d97706, 0 15px 20px rgba(0,0,0,0.15);
        }

        .karuta-card:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #d97706, 0 4px 6px rgba(0,0,0,0.1);
        }

        /* アニメーション：正解時のポップ */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .pop-animation {
            animation: pop 0.3s ease-in-out;
            background-color: #bbf7d0 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }

        /* アニメーション：不正解時のシェイク */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px) rotate(-1deg); }
            50% { transform: translateX(6px) rotate(1deg); }
            75% { transform: translateX(-6px) rotate(-1deg); }
            100% { transform: translateX(0); }
        }
        .shake-animation {
            animation: shake 0.35s ease-in-out;
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }

        /* ポップアップスコア表示 */
        @keyframes float-up {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1.3); }
        }
        .score-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            font-weight: 900;
            z-index: 60;
            pointer-events: none;
            animation: float-up 0.75s ease-out forwards;
        }

        /* おはじき基本スタイル */
        .ohajiki-item {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            user-select: none;
            touch-action: none;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.25), 2px 3px 5px rgba(0,0,0,0.2);
            flex-shrink: 0;
            transition: transform 0.15s, opacity 0.15s, background-color 0.15s;
        }

        @media (min-width: 640px) {
            .ohajiki-item {
                width: 46px;
                height: 46px;
                font-size: 16px;
            }
        }

        /* おはじきの色分類 */
        .ohajiki-red {
            background: radial-gradient(circle at 35% 35%, #fca5a5, #ef4444);
            color: white;
            border: 2px solid #b91c1c;
        }

        .ohajiki-orange {
            background: radial-gradient(circle at 35% 35%, #fdba74, #f97316);
            color: white;
            border: 2px solid #c2410c;
        }

        .ohajiki-blue {
            background: radial-gradient(circle at 35% 35%, #93c5fd, #3b82f6);
            color: white;
            border: 2px solid #1d4ed8;
        }

        .ohajiki-blue.has-x {
            background: #e2e8f0;
            border-color: #94a3b8;
            color: #94a3b8;
            opacity: 0.55;
            box-shadow: none;
        }

        .ohajiki-blue.has-x::after {
            content: "✕";
            position: absolute;
            color: #ef4444;
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 3px white, 0 0 6px white;
            pointer-events: none;
        }

        /* ドラッグ可能グループ用 */
        .draggable-group {
            cursor: grab;
            transition: transform 0.1s ease-out;
        }
        .draggable-group:active {
            cursor: grabbing;
        }

        /* 畳風背景デザイン */
        .bg-tatami {
            background-color: #e2ebb8;
            background-image: radial-gradient(#8fa227 1.2px, transparent 0);
            background-size: 16px 16px;
        }

        #ohajikiArea {
            touch-action: none; /* スマホでのスワイプ時画面スクロール防止 */
        }
    </style>
</head>
<body class="bg-tatami min-h-[100dvh] text-slate-800 flex flex-col justify-between selection:bg-amber-200">

    <header class="bg-amber-700 text-white shadow-md px-4 py-2.5 border-b-4 border-amber-900 z-10 flex-shrink-0">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🎴</span>
                <h1 class="text-lg sm:text-2xl font-black tracking-wider font-kiwi">さんすうかるた</h1>
            </div>
            
            <button id="soundToggleBtn" onclick="toggleSound()" class="bg-amber-800 hover:bg-amber-600 text-amber-100 px-3 py-1 rounded-full text-xs sm:text-sm font-bold flex items-center gap-1.5 transition">
                <i id="soundIcon" class="fa-solid fa-volume-high text-amber-300"></i>
                <span id="soundText">音: ON</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full p-2 sm:p-4 flex-grow flex flex-col justify-center">

        <!-- 1. モード選択＆スタート画面 -->
        <div id="startScreen" class="bg-white/95 backdrop-blur rounded-3xl p-5 sm:p-8 shadow-2xl border-4 border-amber-400 text-center max-w-xl mx-auto w-full">
            <div class="inline-block bg-amber-100 text-amber-900 px-4 py-1 rounded-full text-xs sm:text-sm font-bold mb-3 border border-amber-300">
                ⚡ 制限時間：60秒 ⚡
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-amber-950 mb-5 font-kiwi">モードをえらんでね！</h2>

            <div class="space-y-3">
                <button onclick="startGame(1)" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-extrabold py-3.5 px-5 rounded-2xl shadow-lg transform hover:-translate-y-0.5 transition text-base sm:text-lg border-b-4 border-emerald-800 flex items-center justify-between">
                    <span class="flex items-center gap-3">
                        <span class="bg-white/20 p-2 rounded-xl text-xl">➕</span>
                        <span class="text-left">
                            <span class="block text-xs font-normal text-emerald-100">モード1</span>
                            くりあがり たしざん
                        </span>
                    </span>
                    <span class="text-xs bg-emerald-900/30 px-2 py-1 rounded-lg">2〜9の足し算 (2桁)</span>
                </button>

                <button onclick="startGame(2)" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-extrabold py-3.5 px-5 rounded-2xl shadow-lg transform hover:-translate-y-0.5 transition text-base sm:text-lg border-b-4 border-blue-800 flex items-center justify-between">
                    <span class="flex items-center gap-3">
                        <span class="bg-white/20 p-2 rounded-xl text-xl">➖</span>
                        <span class="text-left">
                            <span class="block text-xs font-normal text-sky-100">モード2</span>
                            くりさがり ひきざん
                        </span>
                    </span>
                    <span class="text-xs bg-sky-900/30 px-2 py-1 rounded-lg">1〜19の引き算 (1桁)</span>
                </button>

                <button onclick="startGame(3)" class="w-full bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white font-extrabold py-3.5 px-5 rounded-2xl shadow-lg transform hover:-translate-y-0.5 transition text-base sm:text-lg border-b-4 border-purple-800 flex items-center justify-between">
                    <span class="flex items-center gap-3">
                        <span class="bg-white/20 p-2 rounded-xl text-xl">🎲</span>
                        <span class="text-left">
                            <span class="block text-xs font-normal text-purple-200">モード3</span>
                            ランダム ＋ おはじきヒント
                        </span>
                    </span>
                    <span class="text-xs bg-purple-900/40 px-2 py-1 rounded-lg">ヒント機能つき！</span>
                </button>
            </div>

            <!-- ハイスコア TOP 5 表示タブ -->
            <div class="mt-6 bg-amber-50 rounded-2xl p-3 border border-amber-200 text-left">
                <div class="flex justify-between items-center mb-2 border-b border-amber-200 pb-1.5">
                    <span class="font-extrabold text-xs text-amber-900 flex items-center gap-1">
                        🏆 <span id="startScoreModeTitle">モード1 のハイスコア (TOP 5)</span>
                    </span>
                    <div class="flex gap-1 text-[11px]">
                        <button onclick="switchRankingTab(1)" id="rankTab1" class="px-2 py-0.5 rounded font-bold bg-amber-600 text-white">モード1</button>
                        <button onclick="switchRankingTab(2)" id="rankTab2" class="px-2 py-0.5 rounded font-bold bg-amber-100 text-amber-800">モード2</button>
                        <button onclick="switchRankingTab(3)" id="rankTab3" class="px-2 py-0.5 rounded font-bold bg-amber-100 text-amber-800">モード3</button>
                    </div>
                </div>
                <ol id="startRankingList" class="text-xs space-y-1 font-bold text-slate-700 min-h-[90px]">
                    <!-- Dynamic ranking list -->
                </ol>
            </div>
        </div>

        <!-- 2. ゲームプレイ画面 -->
        <div id="gameScreen" class="hidden flex-col gap-3">
            
            <!-- スコア＆タイマーバー -->
            <div class="bg-white/95 backdrop-blur px-4 py-2.5 rounded-2xl shadow-md border-2 border-amber-300 flex flex-wrap justify-between items-center gap-2">
                <div class="flex items-center gap-3">
                    <div class="bg-amber-100 text-amber-900 px-2.5 py-1 rounded-xl font-bold text-xs sm:text-sm">
                        モード: <span id="currentModeName" class="text-amber-700">ランダム</span>
                    </div>
                    <div class="text-slate-700 font-bold text-sm sm:text-base relative">
                        スコア: <span id="scoreDisplay" class="text-emerald-600 text-xl sm:text-2xl font-black">0</span> pt
                    </div>
                </div>

                <!-- タイマー表示 -->
                <div class="flex items-center gap-2 min-w-[150px] flex-1 sm:flex-none justify-end">
                    <i class="fa-solid fa-clock text-amber-600 text-lg"></i>
                    <div class="w-28 sm:w-36 bg-slate-200 rounded-full h-3.5 overflow-hidden border border-slate-300">
                        <div id="timerBar" class="bg-gradient-to-r from-emerald-500 to-amber-500 h-full w-full transition-all duration-150"></div>
                    </div>
                    <span id="timerText" class="font-black text-lg sm:text-xl w-8 text-right text-slate-800">60</span>s
                </div>
            </div>

            <!-- 問題カード＆おはじき表示エリア -->
            <div class="bg-white rounded-3xl p-3 sm:p-5 shadow-xl border-4 border-amber-400 min-h-[250px] flex flex-col justify-between relative overflow-hidden">
                
                <!-- スコア獲得ポップアップ演出用コンテナ -->
                <div id="scorePopupContainer" class="absolute inset-0 pointer-events-none z-50"></div>

                <!-- 問題テキスト -->
                <div class="text-center my-1">
                    <span class="text-[11px] font-bold text-amber-700 bg-amber-100 px-3 py-0.5 rounded-full uppercase tracking-wider">もんだい</span>
                    <div id="problemText" class="text-4xl sm:text-6xl font-black text-slate-800 mt-1 tracking-widest font-kiwi min-h-[60px] flex items-center justify-center">
                        ? + ? =
                    </div>
                </div>

                <!-- おはじきヒントコンテナ (モード3で問題表示1秒後に出現) -->
                <div id="ohajikiHintContainer" class="transition-opacity duration-300 mt-1">
                    <div class="bg-emerald-50/90 rounded-2xl p-2.5 sm:p-3 border-2 border-emerald-200 relative min-h-[130px] flex flex-col items-center justify-center">
                        
                        <div id="ohajikiInstruction" class="text-xs font-bold text-emerald-800 mb-2 text-center">
                            🔵 5個ずつ左揃えで配置
                        </div>

                        <!-- おはじき表示エリア -->
                        <div id="ohajikiArea" class="w-full flex justify-center items-center overflow-x-auto py-1">
                            <!-- JSでおはじきグリッドが生成されます -->
                        </div>
                    </div>
                </div>

                <!-- モード1・2用のプレースホルダー -->
                <div id="modePlaceholder" class="h-8 hidden"></div>
            </div>

            <!-- かるた回答選択肢（4つの横並びカード） -->
            <div>
                <div class="text-center text-xs font-bold text-amber-900 mb-1.5 font-kiwi">
                    👇 せいかいの かるた札を タッチしてね！
                </div>
                <div id="karutaContainer" class="grid grid-cols-4 gap-2 sm:gap-3">
                    <!-- JSで選択肢のカードを動的生成 -->
                </div>
            </div>

        </div>

        <!-- 3. 結果発表＆ランキング登録画面 -->
        <div id="resultScreen" class="hidden bg-white/95 backdrop-blur rounded-3xl p-5 sm:p-8 shadow-2xl border-4 border-amber-400 text-center max-w-lg mx-auto w-full">
            <div class="text-4xl sm:text-5xl mb-1">🎉</div>
            <h2 class="text-2xl sm:text-3xl font-black text-amber-950 mb-1 font-kiwi">タイムアップ！</h2>
            <p class="text-slate-600 text-xs sm:text-sm mb-3">お疲れ様でした！結果を発表します！</p>

            <div class="bg-amber-50 rounded-2xl p-4 border-2 border-amber-200 mb-3 space-y-1">
                <div class="text-xs font-bold text-amber-800">今回のスコア</div>
                <div class="text-4xl sm:text-5xl font-black text-amber-600 font-kiwi">
                    <span id="finalScore">0</span> <span class="text-xl font-bold">pt</span>
                </div>
                <div id="rankBadge" class="inline-block bg-amber-500 text-white text-xs font-bold px-3 py-1 rounded-full mt-1">
                    評価: すばらしい！
                </div>
            </div>

            <!-- ランクイン時の名前入力フォーム -->
            <div id="highScoreInputArea" class="hidden bg-emerald-50 rounded-2xl p-3.5 border-2 border-emerald-300 mb-4">
                <p class="text-emerald-700 font-extrabold text-xs sm:text-sm mb-2 animate-pulse">👑 ハイスコア(TOP 5) ランクイン！ 👑</p>
                <div class="flex gap-2">
                    <input type="text" id="playerNameInput" maxlength="10" placeholder="なまえ (10もじまで)" class="w-full px-3 py-2 border-2 border-emerald-400 rounded-xl text-center text-sm font-bold focus:outline-none focus:border-emerald-600">
                    <button onclick="saveResultHighScore()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-4 py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap shadow">
                        とうろく
                    </button>
                </div>
            </div>

            <!-- ハイスコア TOP 5 表示 -->
            <div class="bg-white rounded-2xl p-3 border border-amber-300 mb-4 shadow-inner text-left">
                <h3 class="text-xs font-extrabold text-amber-900 mb-1.5 text-center flex items-center justify-center gap-1">
                    <span>🏆</span> <span id="resultHighScoreTitle">ハイスコア TOP 5</span>
                </h3>
                <ol id="resultHighScoreList" class="text-xs space-y-1 font-bold text-slate-700">
                    <!-- Dynamic ranking -->
                </ol>
            </div>

            <div class="space-y-2">
                <button onclick="restartCurrentMode()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-black py-3 px-5 rounded-2xl shadow-lg transition text-base border-b-4 border-amber-800">
                    🔄 もういちど遊ぶ
                </button>
                <button onclick="showStartScreen()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 px-5 rounded-2xl transition text-sm">
                    🏠 モード選択にもどる
                </button>
            </div>
        </div>

    </main>

    <script>
        /* =========================================================
           Tone.js サウンド生成エンジン
           ========================================================= */
        let synthCorrect = null;
        let synthIncorrect = null;
        let synthBeep = null;
        let soundMuted = false;

        function initAudioEngine() {
            if (!synthCorrect) {
                // 正解音用（和音アルペジオ）
                synthCorrect = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.6 }
                }).toDestination();

                // 不正解音用（低いブザー）
                synthIncorrect = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.02, decay: 0.2, sustain: 0, release: 0.4 }
                }).toDestination();

                // カウントダウンピープ音用
                synthBeep = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.08, sustain: 0, release: 0.1 }
                }).toDestination();
            }

            if (Tone.context.state !== 'running') {
                Tone.start();
            }
        }

        function playCorrectSound() {
            if (soundMuted) return;
            initAudioEngine();
            const now = Tone.now();
            synthCorrect.triggerAttackRelease("C5", "8n", now);
            synthCorrect.triggerAttackRelease("E5", "8n", now + 0.08);
            synthCorrect.triggerAttackRelease("G5", "4n", now + 0.16);
        }

        function playIncorrectSound() {
            if (soundMuted) return;
            initAudioEngine();
            const now = Tone.now();
            synthIncorrect.triggerAttackRelease("C3", "8n", now);
            synthIncorrect.frequency.rampTo("G2", 0.25, now);
        }

        function playBeepSound(isFinal = false) {
            if (soundMuted) return;
            initAudioEngine();
            const now = Tone.now();
            if (isFinal) {
                synthBeep.triggerAttackRelease("A5", "4n", now);
            } else {
                synthBeep.triggerAttackRelease("A4", "8n", now);
            }
        }

        function toggleSound() {
            soundMuted = !soundMuted;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');
            if (soundMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
                text.innerText = '音: OFF';
            } else {
                icon.className = 'fa-solid fa-volume-high text-amber-300';
                text.innerText = '音: ON';
                initAudioEngine();
                playBeepSound(false);
            }
        }

        /* STREAMING_CHUNK:Implementing Game Logic, Timing, Scoring and State -->
        /* =========================================================
           ゲーム状態変数
           ========================================================= */
        let currentMode = 1; // 1: くりあがり, 2: くりさがり, 3: ランダム
        let score = 0;
        let timeLeft = 60;
        let gameTimer = null;
        let currentProblem = null;
        let ohajikiTimer = null;
        let lastPlayedBeepSecond = -1;
        let questionStartTime = 0; // スピード加点計測用

        const MODE_NAMES = {
            1: "くりあげたしざん",
            2: "くりさがりひきざん",
            3: "ランダム ＋ おはじき"
        };

        /* =========================================================
           ハイスコア管理 (localStorage)
           ========================================================= */
        function getHighScores(mode) {
            const data = localStorage.getItem(`karuta_scores_mode_${mode}`);
            return data ? JSON.parse(data) : [];
        }

        function saveHighScoreEntry(mode, name, newScore) {
            let scores = getHighScores(mode);
            scores.push({
                name: name || 'ななし',
                score: newScore,
                date: new Date().toLocaleDateString('ja-JP')
            });
            scores.sort((a, b) => b.score - a.score);
            scores = scores.slice(0, 5); // TOP 5のみ保持
            localStorage.setItem(`karuta_scores_mode_${mode}`, JSON.stringify(scores));
            return scores;
        }

        function isQualifyHighScore(mode, newScore) {
            const scores = getHighScores(mode);
            return scores.length < 5 || newScore > (scores[scores.length - 1]?.score || -Infinity);
        }

        function renderRankingList(containerId, mode, highlightScore = null) {
            const scores = getHighScores(mode);
            const listEl = document.getElementById(containerId);
            listEl.innerHTML = '';

            if (scores.length === 0) {
                listEl.innerHTML = '<li class="text-slate-400 py-2 text-center">きろくなし</li>';
                return;
            }

            scores.forEach((item, index) => {
                const li = document.createElement('li');
                const isCurrent = (highlightScore !== null && item.score === highlightScore);
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                
                li.className = `flex justify-between items-center px-3 py-1 rounded-xl ${isCurrent ? 'bg-amber-200 text-amber-950 font-black border border-amber-400' : 'bg-white border border-slate-100'}`;
                
                const safeName = item.name.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag]));
                li.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-5 text-center">${medal}</span>
                        <span>${safeName}</span>
                    </div>
                    <span class="text-amber-700">${item.score} pt</span>
                `;
                listEl.appendChild(li);
            });
        }

        let selectedStartRankTab = 1;
        function switchRankingTab(mode) {
            selectedStartRankTab = mode;
            for (let m = 1; m <= 3; m++) {
                const btn = document.getElementById(`rankTab${m}`);
                if (m === mode) {
                    btn.className = "px-2 py-0.5 rounded font-bold bg-amber-600 text-white";
                } else {
                    btn.className = "px-2 py-0.5 rounded font-bold bg-amber-100 text-amber-800 hover:bg-amber-200";
                }
            }
            document.getElementById('startScoreModeTitle').innerText = `${MODE_NAMES[mode]} (TOP 5)`;
            renderRankingList('startRankingList', mode);
        }

        /* =========================================================
           画面切り替え & ゲーム進行
           ========================================================= */
        function showStartScreen() {
            clearInterval(gameTimer);
            clearTimeout(ohajikiTimer);
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            switchRankingTab(selectedStartRankTab);
        }

        function startGame(mode) {
            initAudioEngine();
            currentMode = mode;
            score = 0;
            timeLeft = 60;
            lastPlayedBeepSecond = -1;

            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('currentModeName').innerText = MODE_NAMES[mode];

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            updateTimerUI();
            nextProblem();

            // 60秒タイマー開始 (100ms周期でスムーズ更新)
            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    updateTimerUI();
                    endGame();
                } else {
                    updateTimerUI();
                }
            }, 100);
        }

        function restartCurrentMode() {
            startGame(currentMode);
        }

        function updateTimerUI() {
            const integerSeconds = Math.ceil(timeLeft);
            document.getElementById('timerText').innerText = integerSeconds;
            
            const barPercent = (timeLeft / 60) * 100;
            const timerBar = document.getElementById('timerBar');
            timerBar.style.width = barPercent + '%';

            // ラスト10秒でバーの警告色変化
            if (timeLeft <= 10) {
                timerBar.className = "bg-gradient-to-r from-red-500 to-rose-600 h-full transition-all duration-150 animate-pulse";
                document.getElementById('timerText').classList.add('text-red-600');
            } else {
                timerBar.className = "bg-gradient-to-r from-emerald-500 to-amber-500 h-full transition-all duration-150";
                document.getElementById('timerText').classList.remove('text-red-600');
            }

            // カウントダウン音 (ラスト5, 4, 3, 2, 1秒)
            if (integerSeconds <= 5 && integerSeconds >= 1 && integerSeconds !== lastPlayedBeepSecond) {
                lastPlayedBeepSecond = integerSeconds;
                playBeepSound(false);
            } else if (integerSeconds === 0 && lastPlayedBeepSecond !== 0) {
                lastPlayedBeepSecond = 0;
                playBeepSound(true);
            }
        }

        /* =========================================================
           問題生成ロジック
           ========================================================= */
        function generateProblem() {
            let type = 'add';
            let num1 = 0, num2 = 0, answer = 0;

            let activeMode = currentMode;
            if (currentMode === 3) {
                // ランダムモード：足し算・引き算をランダム指定
                activeMode = Math.random() < 0.5 ? 1 : 2;
            }

            if (activeMode === 1) {
                // モード1: くりあがり足し算 (2〜9の足し算、答え2桁: 10〜18)
                type = 'add';
                do {
                    num1 = Math.floor(Math.random() * 8) + 2; // 2〜9
                    num2 = Math.floor(Math.random() * 8) + 2; // 2〜9
                    answer = num1 + num2;
                } while (answer < 10 || answer > 18);
            } else {
                // モード2: くりさがり引き算 (1〜19の引き算、答え1桁: 1〜9)
                type = 'sub';
                do {
                    num1 = Math.floor(Math.random() * 19) + 1; // 1〜19
                    num2 = Math.floor(Math.random() * num1);   // 0〜num1
                    answer = num1 - num2;
                } while (answer < 1 || answer > 9);
            }

            // 4つの選択肢を生成 (正解1つ + ダミー3つ)
            const choices = new Set([answer]);
            while (choices.size < 4) {
                let dummy = answer + (Math.floor(Math.random() * 9) - 4);
                if (dummy >= 0 && dummy <= 19 && dummy !== answer) {
                    choices.add(dummy);
                }
            }

            const choiceArray = Array.from(choices).sort((a, b) => a - b); // 昇順ソート

            return {
                type,
                num1,
                num2,
                answer,
                choices: choiceArray
            };
        }

        function nextProblem() {
            clearTimeout(ohajikiTimer);
            currentProblem = generateProblem();
            questionStartTime = Date.now();

            // 問題表示の更新
            const opSymbol = currentProblem.type === 'add' ? '＋' : '－';
            document.getElementById('problemText').innerText = `${currentProblem.num1} ${opSymbol} ${currentProblem.num2} = ?`;

            const hintContainer = document.getElementById('ohajikiHintContainer');
            const placeholder = document.getElementById('modePlaceholder');
            
            // モード1・2ではすぐにおはじきを表示、モード3では1秒後に出現
            if (currentMode === 3) {
                hintContainer.classList.add('opacity-0');
                hintContainer.classList.add('hidden');
                placeholder.classList.remove('hidden');

                ohajikiTimer = setTimeout(() => {
                    placeholder.classList.add('hidden');
                    hintContainer.classList.remove('hidden');
                    setTimeout(() => hintContainer.classList.remove('opacity-0'), 50);
                    drawOhajikiArea(currentProblem);
                }, 1000);
            } else {
                placeholder.classList.add('hidden');
                hintContainer.classList.remove('hidden');
                hintContainer.classList.remove('opacity-0');
                drawOhajikiArea(currentProblem);
            }

            // かるたカード（4つ横並び）の生成
            const karutaContainer = document.getElementById('karutaContainer');
            karutaContainer.innerHTML = '';

            currentProblem.choices.forEach((choice, index) => {
                const card = document.createElement('button');
                card.className = "karuta-card rounded-2xl py-5 sm:py-7 px-1 flex flex-col items-center justify-center font-black text-3xl sm:text-5xl text-amber-950 font-kiwi cursor-pointer active:scale-95 transition-all";
                
                card.innerHTML = `
                    <span class="text-[10px] sm:text-xs font-normal text-amber-700/60 mb-0.5">札 ${index + 1}</span>
                    <span>${choice}</span>
                `;

                card.onclick = () => checkAnswer(choice, card);
                karutaContainer.appendChild(card);
            });
        }

        /* =========================================================
           おはじき描画＆タッチ操作ロジック (ご提示コード反映)
           ========================================================= */
        function drawOhajikiArea(problem) {
            const ohajikiArea = document.getElementById('ohajikiArea');
            const instruction = document.getElementById('ohajikiInstruction');
            ohajikiArea.innerHTML = '';

            if (problem.type === 'add') {
                instruction.innerText = '🔴 5個ずつ改行で初期配置（スライドやボタンでくっついて再整頓！）';

                // 全体を中央に配置するためのラッパー
                const mainWrapper = document.createElement('div');
                mainWrapper.className = 'flex flex-col sm:flex-row items-center justify-center gap-4 w-full';

                // 【グループ1】赤おはじき（num1個、5個改行）
                const group1Wrapper = document.createElement('div');
                group1Wrapper.className = 'flex flex-col items-start bg-red-50/80 p-2 rounded-2xl border border-red-200';
                
                let row1;
                for (let i = 0; i < problem.num1; i++) {
                    if (i % 5 === 0) {
                        row1 = document.createElement('div');
                        row1.className = 'flex gap-1.5 sm:gap-2 mb-1.5 justify-start w-full';
                        group1Wrapper.appendChild(row1);
                    }
                    const o = document.createElement('div');
                    o.className = 'ohajiki-item ohajiki-red';
                    row1.appendChild(o);
                }

                // 【グループ2】オレンジおはじき（num2個、5個改行・スライド可能）
                const group2Wrapper = document.createElement('div');
                group2Wrapper.className = 'flex flex-col items-start bg-orange-50/80 p-2 rounded-2xl border border-orange-200 draggable-group select-none';
                
                let row2;
                for (let j = 0; j < problem.num2; j++) {
                    if (j % 5 === 0) {
                        row2 = document.createElement('div');
                        row2.className = 'flex gap-1.5 sm:gap-2 mb-1.5 justify-start w-full';
                        group2Wrapper.appendChild(row2);
                    }
                    const o = document.createElement('div');
                    o.className = 'ohajiki-item ohajiki-orange';
                    row2.appendChild(o);
                }

                // 「くっつけて5個ずつ再整頓」アクション
                const mergeAndAlign = () => {
                    initAudioEngine();
                    const now = Tone.now();
                    if (!soundMuted && synthBeep) synthBeep.triggerAttackRelease("E5", "8n", now);

                    ohajikiArea.innerHTML = '';
                    const mergedWrapper = document.createElement('div');
                    mergedWrapper.className = 'flex flex-col items-start bg-amber-50 p-3 rounded-2xl border-2 border-amber-300 animate-pulse-fast';

                    const totalCount = problem.num1 + problem.num2;
                    let currentRow;

                    for (let idx = 0; idx < totalCount; idx++) {
                        if (idx % 5 === 0) {
                            currentRow = document.createElement('div');
                            currentRow.className = 'flex gap-1.5 sm:gap-2 mb-1.5 justify-start w-full';
                            mergedWrapper.appendChild(currentRow);
                        }

                        const o = document.createElement('div');
                        if (idx < problem.num1) {
                            o.className = 'ohajiki-item ohajiki-red';
                        } else {
                            o.className = 'ohajiki-item ohajiki-orange';
                        }
                        currentRow.appendChild(o);
                    }

                    const label = document.createElement('span');
                    label.className = "text-xs font-black text-emerald-700 mt-1 self-center";
                    label.innerText = "✨ あらためて5つ改行で合体整頓しました！";
                    mergedWrapper.appendChild(label);

                    ohajikiArea.appendChild(mergedWrapper);
                };

                // ドラッグ操作による合体発動
                makeGroupDraggable(group2Wrapper, mergeAndAlign);

                mainWrapper.appendChild(group1Wrapper);
                mainWrapper.appendChild(group2Wrapper);

                // 整頓ボタン
                const alignBtn = document.createElement('button');
                alignBtn.className = "bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs px-3 py-2 rounded-xl shadow-md border-b-2 border-amber-800 active:translate-y-0.5 transition self-center";
                alignBtn.innerHTML = '✨ くっつけて5つ整頓';
                alignBtn.onclick = mergeAndAlign;

                mainWrapper.appendChild(alignBtn);
                ohajikiArea.appendChild(mainWrapper);

            } else {
                // 【引き算】5個ずつ改行配置＋指/マウスでなぞって(スワイプ)×印を付ける
                instruction.innerText = '🔵 なぞったりタップして ✕ をつけてね！';

                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col items-start bg-blue-50/80 p-2.5 rounded-2xl border border-blue-200';

                let currentRow;
                for (let i = 0; i < problem.num1; i++) {
                    if (i % 5 === 0) {
                        currentRow = document.createElement('div');
                        currentRow.className = 'flex gap-1.5 sm:gap-2 mb-1.5 justify-start w-full';
                        wrapper.appendChild(currentRow);
                    }

                    const o = document.createElement('div');
                    o.className = 'ohajiki-item ohajiki-blue cursor-pointer select-none';
                    o.dataset.active = "true";
                    o.dataset.type = "sub";

                    // クリック/タップでのトグル
                    o.addEventListener('mousedown', function() {
                        toggleOhajikiState(this);
                    });

                    // PCでのドラッグなぞり
                    o.addEventListener('mouseenter', function(e) {
                        if (e.buttons === 1) {
                            toggleOhajikiState(this, true);
                        }
                    });

                    currentRow.appendChild(o);
                }

                ohajikiArea.appendChild(wrapper);
            }
        }

        // 引き算おはじきの×印トグル関数
        function toggleOhajikiState(el, forceOff = false) {
            if (el.dataset.type !== 'sub') return;
            if (forceOff || el.dataset.active === "true") {
                if (!el.classList.contains('has-x')) {
                    el.dataset.active = "false";
                    el.classList.add('has-x');
                    initAudioEngine();
                    if (!soundMuted && synthBeep) synthBeep.triggerAttackRelease("C4", "16n");
                }
            } else {
                el.dataset.active = "true";
                el.classList.remove('has-x');
            }
        }

        // スマホ/タブレットでのスライド（スワイプ）操作対応 (elementFromPointを使用)
        const ohajikiAreaEl = document.getElementById('ohajikiArea');
        ohajikiAreaEl.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target.classList.contains('ohajiki-blue')) {
                    toggleOhajikiState(target, true);
                }
            }
        }, { passive: false });

        // グループ単位でスライド（ドラッグ）操作
        function makeGroupDraggable(element, onDropMerge) {
            let active = false;
            let currentX = 0, currentY = 0, initialX = 0, initialY = 0;

            const dragStart = (e) => {
                const clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
                initialX = clientX - currentX;
                initialY = clientY - currentY;
                active = true;
            };

            const dragEnd = () => {
                if (!active) return;
                active = false;
                if (Math.abs(currentX) > 25 || Math.abs(currentY) > 25) {
                    onDropMerge();
                } else {
                    element.style.transform = `translate3d(0px, 0px, 0)`;
                    currentX = 0;
                    currentY = 0;
                }
            };

            const drag = (e) => {
                if (!active) return;
                e.preventDefault();
                const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

                currentX = clientX - initialX;
                currentY = clientY - initialY;
                element.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            };

            element.addEventListener("touchstart", dragStart, { passive: false });
            element.addEventListener("touchend", dragEnd, { passive: false });
            element.addEventListener("touchmove", drag, { passive: false });

            element.addEventListener("mousedown", dragStart, false);
            element.addEventListener("mouseup", dragEnd, false);
            element.addEventListener("mousemove", drag, false);
        }

        /* =========================================================
           回答判定＆スコア加減点
           ========================================================= */
        function checkAnswer(selected, cardElement) {
            const elapsed = (Date.now() - questionStartTime) / 1000;

            if (selected === currentProblem.answer) {
                // 正解：時間に応じた加点計算
                // 1秒以内：+5, 2秒以内：+4, 4秒以内：+2, それ以降：+1
                let addedPoints = 1;
                let bonusLabel = "＋1";

                if (elapsed <= 1.0) {
                    addedPoints = 5;
                    bonusLabel = "⚡ ＋5 (超高速!)";
                } else if (elapsed <= 2.0) {
                    addedPoints = 4;
                    bonusLabel = "🔥 ＋4 (はやい!)";
                } else if (elapsed <= 4.0) {
                    addedPoints = 2;
                    bonusLabel = "👍 ＋2";
                } else {
                    addedPoints = 1;
                    bonusLabel = "＋1";
                }

                playCorrectSound();
                score += addedPoints;
                document.getElementById('scoreDisplay').innerText = score;

                // ポップアップ演出
                showScorePopup(bonusLabel, 'text-emerald-600');

                // カードアニメーション
                cardElement.classList.add('pop-animation');

                setTimeout(() => {
                    nextProblem();
                }, 300);

            } else {
                // 不正解：-1pt 減点
                playIncorrectSound();
                score -= 1;
                document.getElementById('scoreDisplay').innerText = score;

                showScorePopup("−1", 'text-red-600');

                cardElement.classList.add('shake-animation');
                setTimeout(() => {
                    cardElement.classList.remove('shake-animation');
                }, 400);
            }
        }

        function showScorePopup(text, colorClass) {
            const container = document.getElementById('scorePopupContainer');
            const popup = document.createElement('div');
            popup.className = `score-popup text-2xl sm:text-4xl ${colorClass}`;
            popup.innerText = text;
            container.appendChild(popup);

            setTimeout(() => {
                popup.remove();
            }, 750);
        }

        /* =========================================================
           結果発表＆ハイスコア保存
           ========================================================= */
        function endGame() {
            clearInterval(gameTimer);
            clearTimeout(ohajikiTimer);

            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;

            // ランク評価テキスト
            const rankBadge = document.getElementById('rankBadge');
            if (score >= 60) {
                rankBadge.innerText = '評価: 👑 算数神スピードマスター！';
                rankBadge.className = 'inline-block bg-purple-600 text-white text-xs font-bold px-4 py-1 rounded-full mt-1 shadow';
            } else if (score >= 35) {
                rankBadge.innerText = '評価: ⭐ すばやい！たいへん良く出来ました！';
                rankBadge.className = 'inline-block bg-amber-500 text-white text-xs font-bold px-4 py-1 rounded-full mt-1 shadow';
            } else if (score >= 15) {
                rankBadge.innerText = '評価: 👍 ナイスチャレンジ！';
                rankBadge.className = 'inline-block bg-blue-500 text-white text-xs font-bold px-4 py-1 rounded-full mt-1 shadow';
            } else {
                rankBadge.innerText = '評価: 🌱 つぎはもっとスピードアップ！';
                rankBadge.className = 'inline-block bg-slate-500 text-white text-xs font-bold px-4 py-1 rounded-full mt-1 shadow';
            }

            // ハイスコアランクイン判定
            const qualifies = isQualifyHighScore(currentMode, score);
            const inputArea = document.getElementById('highScoreInputArea');
            if (qualifies) {
                inputArea.classList.remove('hidden');
                document.getElementById('playerNameInput').value = '';
                document.getElementById('playerNameInput').focus();
            } else {
                inputArea.classList.add('hidden');
            }

            document.getElementById('resultHighScoreTitle').innerText = `${MODE_NAMES[currentMode]} TOP 5`;
            renderRankingList('resultHighScoreList', currentMode, score);

            // 紙吹雪アニメーション
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function saveResultHighScore() {
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim() || 'ななし';
            saveHighScoreEntry(currentMode, name, score);
            document.getElementById('highScoreInputArea').classList.add('hidden');
            renderRankingList('resultHighScoreList', currentMode, score);
        }

        // 初回起動時のハイスコア初期表示
        switchRankingTab(1);
    </script>
